# Fabrique et teste Cube Hub LLM pour Linux (Ubuntu, Debian) et Windows.
# Un tag « v* » (par exemple v1.0.0) publie les paquets dans une Release.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  linux:
    name: Paquets Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Vérifier la syntaxe
        run: for f in src/*.js src/renderer/*.js src/renderer/common/*.js scripts/*.js; do node --check "$f"; done
      - name: Fabriquer les .deb et .tar.gz (amd64, arm64)
        run: node scripts/package-linux.js amd64 arm64
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/linux/*

  test-ubuntu:
    name: Test sur Ubuntu 24.04
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist/linux
      - name: Installer le paquet (vérifie aussi les dépendances)
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/linux/cube-hub-llm_*_amd64.deb xvfb dbus-x11
          ls -l /opt/cube-hub-llm/chrome-sandbox /usr/bin/cube-hub-llm /usr/share/applications/cube-hub-llm.desktop
          test -f /etc/apparmor.d/cube-hub-llm && echo "profil AppArmor installé"
      - name: Scénario complet contre un faux Open WebUI et un faux Telegram
        run: |
          node scripts/mock-openwebui.js 8080 &
          node scripts/mock-telegram.js /tmp/tg.log &
          sleep 1
          export CUBE_LLM_DIR=/tmp/cube CUBE_SCENARIO=/tmp/captures CUBE_LLM_URL=http://127.0.0.1:8080 CUBE_LLM_KEY=sk-test CUBE_TELEGRAM_API=http://127.0.0.1:8787
          timeout 240 dbus-run-session -- xvfb-run -a -s "-screen 0 1440x900x24" cube-hub-llm 2>&1 | grep -v -i "gpu\|dbus\|libva\|viz_main" | tee /tmp/sortie.txt
          echo "--- messages Telegram envoyés ---"
          grep -o '"text":"[^"]*' /tmp/tg.log | cut -c9-120 || true
          grep -q "currentId ok : true" /tmp/sortie.txt
          grep -q "rangée dans : f-perso" /tmp/sortie.txt
          grep -q "réponse prête" /tmp/tg.log
          ls /tmp/captures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-ubuntu
          path: /tmp/captures

  test-debian:
    name: Installation sur Debian 12
    needs: linux
    runs-on: ubuntu-24.04
    container: debian:12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist/linux
      - name: Installer le paquet
        run: |
          apt-get update
          apt-get install -y ./dist/linux/cube-hub-llm_*_amd64.deb xvfb xauth
          ls -l /opt/cube-hub-llm/chrome-sandbox /usr/bin/cube-hub-llm
      - name: Démarrage rapide
        run: |
          export CUBE_LLM_DIR=/tmp/cube CUBE_SNAPSHOT=/tmp/captures
          timeout 120 xvfb-run -a cube-hub-llm --no-sandbox 2>&1 | grep -v -i "gpu\|dbus" || true
          ls /tmp/captures
          test -s /tmp/captures/hub.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-debian
          path: /tmp/captures

  windows:
    name: Version Windows
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/package.js
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path "dist/Cube Hub LLM/*" -DestinationPath "dist/Cube-Hub-LLM-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Cube-Hub-LLM-windows-x64.zip

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-ubuntu, test-debian, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "Cube Hub LLM ${GITHUB_REF_NAME}" \
            --notes "Ubuntu / Debian : \`sudo apt install ./cube-hub-llm_*_amd64.deb\` (arm64 pour Raspberry Pi et ARM). Windows : dézipper et lancer « Cube Hub LLM.exe »." \
            out/linux/* out/windows/*
